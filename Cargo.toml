[package]
name = "revm-scroll"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
alloy-evm = { version = "0.29.2", default-features = false }

# revm
revm = { version = "36.0.0", default-features = false }
revm-primitives = {  version = "22.0.0", default-features = false }
revm-inspector = { version = "17.0.0", default-features = false }

# misc
auto_impl = "1.2.0"
enumn = { version = "0.1" }
once_cell = { version = "1.19", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"], optional = true, default-features = false }

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst"]
std = ["serde?/std", "revm/std", "revm-primitives/std", "revm-inspector/std"]
hashbrown = ["revm/hashbrown", "revm-primitives/hashbrown"]
serde = ["dep:serde", "revm/serde", "revm-primitives/serde", "revm-inspector/serde"]
portable = ["revm/portable"]

test-utils = []

# See comments in `revm-precompile`
secp256k1 = ["revm/secp256k1"]
c-kzg = ["revm/c-kzg"]
blst = ["revm/blst"]

[dev-dependencies]
rstest = "0.26.1"
